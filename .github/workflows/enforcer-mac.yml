name: enforcer-mac

# Builds a universal (Apple Silicon + Intel) macOS tarball of our easynet enforcer fork
# (github.com/mbdrivechains/bip300301_enforcer) at a tag, and attaches it, attested, to the release of the same tag
# in THIS repository, adding its line to SHA256SUMS.
#   gh workflow run enforcer-mac.yml -R mbdrivechains/bitcoin -f tag=easynet-3
# Each CPU is built natively on its own runner (cargo --locked), then the two are joined with lipo and ad-hoc signed.
# The test runs the universal enforcer, set up as EASYNET.md says, against this release's own macOS node on the live
# easynet, with Homebrew hidden.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag on mbdrivechains/bip300301_enforcer, with a release of the same tag here (e.g. easynet-3)"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: mbdrivechains/bip300301_enforcer
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
          rustup target add ${{ matrix.target }}
          rustc --version

      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }} -p bip300301_enforcer --bin bip300301_enforcer

      - name: Smoke test
        run: |
          E=target/${{ matrix.target }}/release/bip300301_enforcer
          "$E" --version
          "$E" --help | grep -A8 -- '--network-preset' | grep 'easynet:'

      - name: Stage
        run: |
          mkdir out
          cp target/${{ matrix.target }}/release/bip300301_enforcer README.md out/
          git log -1 --format="source: github.com/mbdrivechains/bip300301_enforcer @ %H (%cs)" > out/SOURCE

      - uses: actions/upload-artifact@v4
        with:
          name: enforcer-${{ matrix.target }}
          path: out

  universal:
    needs: build
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write        # upload to the release
      id-token: write        # build provenance (attestation)
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@v4

      - name: Join the two CPUs (lipo) and ad-hoc sign
        run: |
          NAME="bip300301_enforcer-${TAG}-universal-apple-darwin"
          mkdir "$NAME"
          lipo -create enforcer-aarch64-apple-darwin/bip300301_enforcer enforcer-x86_64-apple-darwin/bip300301_enforcer \
            -output "$NAME/bip300301_enforcer"
          chmod 755 "$NAME/bip300301_enforcer"
          codesign -s - -f "$NAME/bip300301_enforcer"
          lipo -archs "$NAME/bip300301_enforcer"
          cp enforcer-aarch64-apple-darwin/README.md enforcer-aarch64-apple-darwin/SOURCE "$NAME/"
          cat "$NAME/SOURCE"
          echo "NAME=$NAME" >> "$GITHUB_ENV"

      - name: Portability gate (only /usr/lib and /System/Library)
        run: |
          otool -L "$NAME/bip300301_enforcer"
          BAD=$(otool -L "$NAME/bip300301_enforcer" | grep -E '^\s' | grep -vE '^\s+(/usr/lib/|/System/Library/)' || true)
          [ -z "$BAD" ] || { echo "NON-PORTABLE:"; echo "$BAD"; exit 1; }

      - name: Run against the live easynet, set up as EASYNET.md says (Homebrew hidden)
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "bitcoin-${TAG}-universal-apple-darwin.tar.gz"
          tar -xzf "bitcoin-${TAG}-universal-apple-darwin.tar.gz"
          B=$PWD/bitcoin-${TAG}/bin
          sudo mv /opt/homebrew /opt/homebrew.hidden
          trap 'sudo mv /opt/homebrew.hidden /opt/homebrew' EXIT
          DD="$HOME/Library/Application Support/eCash"
          mkdir -p "$DD"
          printf '[easynet]\nserver=1\ntxindex=1\nzmqpubsequence=tcp://127.0.0.1:28535\n' > "$DD/ecash.conf"
          "$B/bitcoind" -daemon
          for i in $(seq 1 30); do "$B/bitcoin-cli" getblockchaininfo >/dev/null 2>&1 && break; sleep 1; done
          for i in $(seq 1 90); do
            I=$("$B/bitcoin-cli" getblockchaininfo)
            b=$(echo "$I" | python3 -c 'import json,sys; print(json.load(sys.stdin)["blocks"])')
            h=$(echo "$I" | python3 -c 'import json,sys; print(json.load(sys.stdin)["headers"])')
            [ "$b" -gt 0 ] && [ "$b" = "$h" ] && break; sleep 2
          done
          echo "$I" | head -4
          "$NAME/bip300301_enforcer" --network-preset=easynet \
            --node-rpc-addr=127.0.0.1:28532 --node-rpc-cookie-path="$DD/easynet/.cookie" \
            --node-zmq-addr-sequence=tcp://127.0.0.1:28535 \
            --enable-wallet --wallet-auto-create --wallet-sync-source=disabled \
            --bitcoin-core-skip-version-check > enforcer.log 2>&1 &
          P=$!
          ok=0
          for i in $(seq 1 60); do
            grep -q "synced to tip" enforcer.log && { ok=1; break; }
            kill -0 $P 2>/dev/null || break
            sleep 2
          done
          grep -E "Synced [0-9]+ blocks|synced to tip|ERROR" enforcer.log | head -5 || true
          kill $P 2>/dev/null || true
          "$B/bitcoin-cli" stop
          sleep 3
          [ $ok = 1 ] || { echo "enforcer did not sync to the tip"; tail -30 enforcer.log; exit 1; }
          echo "enforcer synced easynet to block $b"

      - name: Package
        run: |
          F="${NAME}.tar.gz"
          tar -czf "$F" "$NAME"
          shasum -a 256 "$F" | tee mac.sha256
          echo "F=$F" >> "$GITHUB_ENV"

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.F }}

      - name: Attach to the release and update SHA256SUMS
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p SHA256SUMS -O SHA256SUMS.old || : > SHA256SUMS.old
          grep -v " $F\$" SHA256SUMS.old > SHA256SUMS || true
          cat mac.sha256 >> SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber "$F" SHA256SUMS
